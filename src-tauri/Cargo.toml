[package]
name = "legado-tauri"
version = "0.8.0"
description = "Legado Tauri minimal backend"
authors = ["Legado Tauri"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "legado_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "legado-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.1", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.3"
